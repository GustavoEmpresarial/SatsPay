server {
  # Non-root nginx (UID 101) cannot bind :80 — keep in sync with client/Dockerfile EXPOSE.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- Browser security baseline (OWASP / React XSS containment) ---
  # COOP: allow OAuth popups to keep window.opener when merchant is not isolated.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  # CSP: React escapes JSX by default; this blocks injected script origins even if XSS slips through.
  # Turnstile + Google Fonts + https images (OAuth app logos / favicons) are explicitly allowed.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:;" always;

  # SDK must not be immutable forever — merchants embed this file cross-origin.
  # Cloudflare-CDN-Cache-Control overrides CF edge TTL independently of browser Cache-Control.
  # Note: nginx does not inherit add_header from server{} into a location that sets its own.
  location ^~ /sdk/ {
    expires 5m;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header CDN-Cache-Control "public, max-age=300, must-revalidate" always;
    add_header Cloudflare-CDN-Cache-Control "public, max-age=300, must-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
    try_files $uri =404;
  }

  # Cache hashed Vite assets aggressively (JS, CSS, fonts, images)
  location ~* \.(?:js|css|woff2|woff|ttf|png|jpg|jpeg|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    # SPA shell must never stick on an old hashed JS reference after deploy.
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }

  location /v1/ {
    proxy_pass http://api-server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Trust only the immediate peer ($remote_addr). Caddy/CF sit in front and
    # must set X-Real-IP from CF-Connecting-IP at the edge — never copy a
    # client-supplied CF-Connecting-IP here (spoofable without Cloudflare).
    set $client_ip $remote_addr;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /.well-known/ {
    proxy_pass http://api-server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    set $client_ip $remote_addr;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API liveness probe consumed by the /status page.
  location = /healthz {
    proxy_pass http://api-server:4000/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }
}
