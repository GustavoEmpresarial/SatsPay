name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libs for rdkafka-sys (cmake-build needs curl headers)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Rust unit
        run: cargo test --workspace --lib --bins --quiet
      - name: Client install
        working-directory: client
        run: npm ci --no-audit --no-fund
      - name: Client unit + property + contract + acceptance
        working-directory: client
        run: npx vitest run tests/unit --reporter=dot
      - name: Logic coverage gate
        working-directory: client
        run: npm run test:logic

  rust-llvm-cov:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bitcosats
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bitcosats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bitcosats -d bitcosats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: System libs for rdkafka-sys (cmake-build needs curl headers)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Core pure crates line coverage ≥90%
        run: |
          cargo llvm-cov --package shared --package crypto --package domain --lib \
            --fail-under-lines 90 --summary-only
      - name: Expanded crates line coverage ≥90%
        env:
          DATABASE_URL: postgresql://bitcosats:test@127.0.0.1:5432/bitcosats
        run: |
          cargo llvm-cov --package pricing --package swapkit --package captcha --package queue \
            --lib --tests --fail-under-lines 90 --summary-only
          cargo llvm-cov --package events --lib --tests \
            --ignore-filename-regex '(producer|relay)\.rs$' \
            --fail-under-lines 90 --summary-only
          cargo llvm-cov --package chain --lib --tests \
            --ignore-filename-regex '(rpc_client|real_client|bitcore_client|dgb_client|evm_client|sol_client)\.rs$' \
            --fail-under-lines 90 --summary-only
          cargo llvm-cov --package db --lib --tests --fail-under-lines 90 --summary-only

  rust-bins-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libs for rdkafka-sys (cmake-build needs curl headers)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev
      - name: Compile worker + api-server + notify
        run: cargo check -p worker -p api-server -p notify --quiet
      - name: Worker + notify unit
        run: cargo test -p worker --bins --quiet && cargo test -p notify --lib --quiet

  smoke-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Client install
        working-directory: client
        run: npm ci --no-audit --no-fund
      - name: Docker Postgres smokes
        working-directory: client
        run: npm run test:smoke

  rust-db-sqlx:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bitcosats
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bitcosats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bitcosats -d bitcosats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: System libs for rdkafka-sys (cmake-build needs curl headers)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: db sqlx integration
        env:
          DATABASE_URL: postgresql://bitcosats:test@127.0.0.1:5432/bitcosats
        run: cargo test -p db --tests --quiet
      - name: api-http oneshot (Postgres)
        env:
          DATABASE_URL: postgresql://bitcosats:test@127.0.0.1:5432/bitcosats
        run: cargo test -p api-http --tests --quiet
      - name: queue sqlx (Postgres)
        env:
          DATABASE_URL: postgresql://bitcosats:test@127.0.0.1:5432/bitcosats
        run: cargo test -p queue --tests --quiet
      - name: Coverage summary api-http (informational until ≥90)
        env:
          DATABASE_URL: postgresql://bitcosats:test@127.0.0.1:5432/bitcosats
        run: cargo llvm-cov --package api-http --lib --tests --summary-only

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      - name: cargo audit
        run: cargo audit --deny warnings || cargo audit
      - name: npm audit (high+)
        working-directory: client
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  secrets-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose must not hardcode Turnstile bypass
        run: |
          if grep -n 'TURNSTILE_SECRET: *"disabled_in_dev"' deploy/docker/docker-compose.yml; then
            echo "FAIL: production compose hardcodes disabled_in_dev"
            exit 1
          fi
          grep -q 'TURNSTILE_SECRET: \${TURNSTILE_SECRET' deploy/docker/docker-compose.yml
          grep -q 'NODE_ENV: \${NODE_ENV' deploy/docker/docker-compose.yml
          grep -q 'COOKIE_SECURE' deploy/docker/docker-compose.yml
      - name: Deploy script must not embed an SSH password
        run: |
          # Fails on any non-empty string literal assigned/defaulted as a credential.
          # `env.get("DEPLOY_SSH_PASSWORD") or ""` (empty default) is allowed.
          if grep -nE '(PASSWORD|PASS|SECRET)[A-Z_]*\s*=\s*["'"'"'][^"'"'"']+["'"'"']|DEPLOY_SSH_PASSWORD.+\bor\s+["'"'"'][^"'"'"']+["'"'"']' scripts/deploy_to_vm.py; then
            echo "FAIL: deploy_to_vm.py still has a password fallback"
            exit 1
          fi
          grep -q 'DEPLOY_SSH_KEY' scripts/deploy_to_vm.py
          grep -q 'require_ssh_creds' scripts/deploy_to_vm.py
