# NOT applied by kustomization.yaml — reference only, same posture as
# ../api-server/secret.example.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: worker-secrets
type: Opaque
stringData:
  # DATABASE_URL is NOT here — deployment.yaml sources it directly from the
  # CloudNativePG-generated `bitcosats-postgres-app` Secret's `uri` key.
  BITCORE_API_BASE_URL: ""
  EVM_RPC_URL: ""
  CHAIN_DEPOSIT_XPUB: ""
  EVM_DEPOSIT_LOOKBACK_BLOCKS: ""
  HOT_WALLET_WIF: ""
