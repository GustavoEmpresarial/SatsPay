# SecretStore backed by HashiCorp Vault — swap `provider` for AWS/GCP/Azure
# equivalents per docs/decisions/ ADR on ESO vs Sealed Secrets (ESO chosen:
# rotation is automatic, the secret material never touches Git, unlike
# Sealed Secrets where the ciphertext lives in-repo). Requires the
# external-secrets operator installed via Helm — see
# docs/operations/deployment.md.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: bitcosats-vault
  namespace: bitcosats
spec:
  provider:
    vault:
      server: "https://vault.internal:8200" # real address supplied per-environment
      path: "secret"
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: bitcosats-secret-reader
          serviceAccountRef:
            name: external-secrets-sa
