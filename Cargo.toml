[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/domain",
    "crates/db",
    "crates/crypto",
    "crates/chain",
    "crates/events",
    "crates/queue",
    "crates/notify",
    "crates/captcha",
    "crates/pricing",
    "crates/swapkit",
    "crates/webhooks",
    "crates/api-http",
    "crates/worker",
    "crates/api-server",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "bigdecimal", "migrate"] }
bigdecimal = { version = "0.4", features = ["serde"] }

shared = { path = "crates/shared" }
domain = { path = "crates/domain" }
db = { path = "crates/db" }
crypto = { path = "crates/crypto" }
chain = { path = "crates/chain" }
events = { path = "crates/events" }
queue = { path = "crates/queue" }
notify = { path = "crates/notify" }
captcha = { path = "crates/captcha" }
pricing = { path = "crates/pricing" }
swapkit = { path = "crates/swapkit" }
webhooks = { path = "crates/webhooks" }
wiremock = "0.6"
